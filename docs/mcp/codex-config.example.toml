[mcp_servers.vercel]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@vercel/mcp-server",
]

[mcp_servers.filesystem]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@modelcontextprotocol/server-filesystem",
    "C:\\Users\\kevin\\OneDrive\\Documents\\Dev\\alcide",
]

[mcp_servers.playwright]
command = "cmd"
args = [
    "/c",
    "npx",
    "-y",
    "@playwright/mcp@latest",
]

# Example only. Keep GITHUB_PERSONAL_ACCESS_TOKEN outside Git.
# Codex support for remote HTTP MCP servers depends on the host version.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}" }
