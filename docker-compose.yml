services:
  # ─── Base de données PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: alcide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: alcide
      POSTGRES_PASSWORD: alcide_dev
      POSTGRES_DB: alcide
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alcide -d alcide"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Hono ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: alcide-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://alcide:alcide_dev@postgres:5432/alcide
      # OWASP A02: les secrets sensibles viennent du fichier .env (non commité)
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set in .env}
      SERVICE_SECRET: ${SERVICE_SECRET:?SERVICE_SECRET must be set in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Outils ponctuels : ils utilisent le stage builder, qui contient drizzle-kit,
  # tsx et les sources. Le runtime API reste volontairement minimal.
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alcide:alcide_dev@postgres:5432/alcide
    command: ["pnpm", "--filter", "api", "db:migrate"]

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://alcide:alcide_dev@postgres:5432/alcide
    command: ["pnpm", "--filter", "api", "db:seed"]

  # ─── Frontend Next.js ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
    container_name: alcide-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:3001}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID must be set in .env}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET must be set in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      SERVICE_SECRET: ${SERVICE_SECRET:?SERVICE_SECRET must be set in .env}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
