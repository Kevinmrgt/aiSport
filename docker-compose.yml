services:
  postgres:
    image: postgres:16-alpine
    container_name: sportcoach-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sportcoach
      POSTGRES_PASSWORD: sportcoach_dev
      POSTGRES_DB: sportcoach_ia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportcoach -d sportcoach_ia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
