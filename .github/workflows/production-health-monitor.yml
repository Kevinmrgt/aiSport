name: Monitoring - Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      check_mode:
        description: 'Production checks, or a safe alert/recovery simulation without probing production'
        required: true
        default: production
        type: choice
        options:
          - production
          - simulate_alert
          - simulate_recovery

permissions:
  contents: read
  issues: write

concurrency:
  # Keep a production run cancellable by a newer production run, but do not let
  # the hourly schedule interrupt a manual RNCP alert/recovery demonstration.
  group: production-health-monitor-${{ inputs.check_mode || 'production' }}
  cancel-in-progress: true

env:
  API_HEALTH_URL: ${{ vars.PROD_API_HEALTH_URL || 'https://ai-sport-api.vercel.app/health/ready' }}
  WEB_HEALTH_URL: ${{ vars.PROD_WEB_HEALTH_URL || 'https://ai-sport-web.vercel.app/api/health' }}
  CHECK_MODE: ${{ inputs.check_mode || 'production' }}

jobs:
  healthcheck:
    name: Check production health endpoints
    runs-on: ubuntu-latest
    steps:
      - name: Check API and Web health
        shell: bash
        run: |
          set -o pipefail
          mkdir -p monitoring-report
          report="monitoring-report/production-health.md"

          {
            echo "# Production health monitor"
            echo
            echo "- Checked at: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            echo "- API: ${API_HEALTH_URL}"
            echo "- Web: ${WEB_HEALTH_URL}"
            echo "- Mode: ${CHECK_MODE}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
          } > "$report"

          if [ "$CHECK_MODE" = "simulate_alert" ]; then
            {
              echo "## Alert simulation"
              echo
              echo "- Result: intentionally failed for a manual alert demonstration"
              echo "- Production endpoints: not probed"
              echo "- Production resources: not modified"
            } >> "$report"
            exit 1
          fi

          if [ "$CHECK_MODE" = "simulate_recovery" ]; then
            {
              echo "## Recovery simulation"
              echo
              echo "- Result: intentionally successful for a manual recovery demonstration"
              echo "- Production endpoints: not probed"
              echo "- Production resources: not modified"
            } >> "$report"
            exit 0
          fi

          check_endpoint() {
            local name="$1"
            local url="$2"
            local expected_status="$3"
            local output_file="monitoring-report/${name}.json"
            local http_code

            http_code="$(curl \
              --location \
              --silent \
              --show-error \
              --max-time 20 \
              --retry 2 \
              --retry-delay 5 \
              --write-out "%{http_code}" \
              --output "$output_file" \
              "$url")"

            {
              echo "## ${name}"
              echo
              echo "- HTTP status: ${http_code}"
            }

            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "- Result: failed HTTP check"
              return 1
            fi

            if ! jq -e --arg expected "$expected_status" '.status == $expected' "$output_file" >/dev/null; then
              echo "- Result: failed JSON status check"
              echo '```json'
              cat "$output_file"
              echo
              echo '```'
              return 1
            fi

            {
              echo "- Result: ok"
              echo "- Payload:"
              echo '```json'
              jq . "$output_file"
              echo '```'
              echo
            }
          }

          status=0
          check_endpoint api "$API_HEALTH_URL" "ready" >> "$report" || status=1
          check_endpoint web "$WEB_HEALTH_URL" "ok" >> "$report" || status=1

          exit "$status"

      - name: Upload monitoring report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-health-report
          path: monitoring-report/
          if-no-files-found: error

      - name: Open or update monitoring issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Production healthcheck failed"
          label="monitoring"
          label_description="Production health monitoring"
          if [ "$CHECK_MODE" = "simulate_alert" ]; then
            title="[TEST] Production healthcheck alert simulation"
            label="monitoring-test"
            label_description="Safe production-health alert simulation"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          gh label create "$label" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0969DA" \
            --description "$label_description" 2>/dev/null || true

          existing_issue="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$label" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)"

          {
            if [ "$CHECK_MODE" = "simulate_alert" ]; then
              echo "This is a safe, intentional alert simulation."
              echo "No production endpoint was probed or modified."
            else
              echo "A production healthcheck failed."
            fi
            echo
            echo "- Mode: ${CHECK_MODE}"
            echo "- API: ${API_HEALTH_URL}"
            echo "- Web: ${WEB_HEALTH_URL}"
            echo "- Workflow run: ${run_url}"
            echo
            cat monitoring-report/production-health.md
          } > monitoring-report/issue-body.md

          if [ -z "$existing_issue" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label "$label" \
              --body-file monitoring-report/issue-body.md
          else
            gh issue comment "$existing_issue" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file monitoring-report/issue-body.md
          fi

      - name: Close recovered monitoring issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="Production healthcheck failed"
          label="monitoring"
          label_description="Production health monitoring"
          recovered_message="Healthchecks recovered"
          if [ "$CHECK_MODE" = "simulate_recovery" ]; then
            title="[TEST] Production healthcheck alert simulation"
            label="monitoring-test"
            label_description="Safe production-health alert simulation"
            recovered_message="Safe alert simulation recovered"
          fi

          gh label create "$label" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0969DA" \
            --description "$label_description" 2>/dev/null || true

          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "$label" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body "${recovered_message} in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
            gh issue close "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --comment "Closing after successful ${CHECK_MODE} run."
          fi
