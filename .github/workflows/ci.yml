name: CI - Alcide

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Tests, including the restored visit tracker, must never target production.
  NEXT_PUBLIC_API_URL: http://localhost:3001
  API_URL: http://localhost:3001
  NEXTAUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-auth-secret-change-only-in-ci
  AUTH_GOOGLE_ID: ci-google-client-id
  AUTH_GOOGLE_SECRET: ci-google-client-secret
  SERVICE_SECRET: ci-service-secret-change-only-in-ci

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Test Vercel deployment policy
        run: pnpm test:vercel-ignore

      - name: Test CD workflow policy
        run: node --test scripts/*.test.mjs

      - name: Test the bounded administrative production recipe policy without network access
        run: node --test apps/api/scripts/qualify-production-admin.policy.mjs

      - name: Test authenticated E2E storage policy
        run: pnpm test:e2e:auth-policy

  test-unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alcide
          POSTGRES_PASSWORD: alcide_dev
          POSTGRES_DB: alcide_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alcide -d alcide_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Apply database migrations for integration tests
        run: pnpm --filter api db:migrate
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test

      - name: Run API and Web tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test
          TEST_DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test
          OPENAI_API_KEY: ci-synthetic-provider-key-not-for-network

      - name: Run PostgreSQL repository tests with dedicated coverage
        run: pnpm --filter api test:integration:coverage
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test
          TEST_DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test

      - name: Run PostgreSQL security recipe without skipping
        run: pnpm --filter api exec vitest run --config vitest.security.config.ts
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test
          TEST_DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide_test

      - name: Upload API coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-api
          path: apps/api/coverage/
          if-no-files-found: ignore

      - name: Upload Shared coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-shared
          path: packages/shared/coverage/
          if-no-files-found: error

      - name: Upload Web coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-web
          path: apps/web/coverage/
          if-no-files-found: error

      - name: Upload PostgreSQL integration coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report-api-integration
          path: apps/api/coverage/integration/
          if-no-files-found: error

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alcide_audit
          POSTGRES_PASSWORD: ci-local-test-only
          POSTGRES_DB: alcide_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alcide_audit -d alcide_audit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          DATABASE_URL: postgresql://alcide_audit:ci-local-test-only@127.0.0.1:5432/alcide_audit
          OPENAI_API_KEY: ci-synthetic-provider-key-not-for-network

      - name: Migrate isolated recipe database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://alcide_audit:ci-local-test-only@127.0.0.1:5432/alcide_audit

      - name: Install Chromium for synthetic authenticated recipes
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run compiled Web and API recipes with synthetic sessions and provider
        run: node apps/web/scripts/local-production-recipes.mjs
        env:
          LOCAL_PRODUCTION_RECIPES: '1'
          TEST_DATABASE_URL: postgresql://alcide_audit:ci-local-test-only@127.0.0.1:5432/alcide_audit

      - name: Preserve sanitized synthetic recipe result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-production-recipes
          path: tmp/production-remediation/fullstack.json
          if-no-files-found: ignore

  test-e2e-smoke:
    name: E2E smoke and accessibility
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium firefox

      - name: Run public E2E smoke tests
        # The build is completed before next start; cold dev compilation is not a release test.
        # Keep this separate from the ordinary build job so Playwright owns its local server.
        run: pnpm --filter web build && pnpm test:e2e:smoke
        env:
          CI: true
          E2E_PRODUCTION: '1'

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag alcide-api:ci .

      - name: Build Web image
        run: >
          docker build
          --file apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001
          --tag alcide-web:ci .
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-auth-secret-change-only-in-ci
          AUTH_GOOGLE_ID: ci-google-client-id
          AUTH_GOOGLE_SECRET: ci-google-client-secret
          SERVICE_SECRET: ci-service-secret-change-only-in-ci

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=low

