name: CI - SportCoach IA

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
  NEXTAUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-auth-secret-change-only-in-ci
  AUTH_GITHUB_ID: ci-github-client-id
  AUTH_GITHUB_SECRET: ci-github-client-secret
  SERVICE_SECRET: ${{ secrets.SERVICE_SECRET || 'ci-service-secret-change-only-in-ci' }}

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

  test-unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Run API tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://sportcoach:sportcoach_dev@localhost:5432/sportcoach_ia
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: apps/api/coverage/
          if-no-files-found: ignore

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          DATABASE_URL: postgresql://sportcoach:sportcoach_dev@localhost:5432/sportcoach_ia
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

  test-e2e-smoke:
    name: E2E smoke and accessibility
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium firefox

      - name: Run public E2E smoke tests
        run: pnpm test:e2e:smoke
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag sportcoach-api:ci .

      - name: Build Web image
        run: >
          docker build
          --file apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001
          --tag sportcoach-web:ci .
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-auth-secret-change-only-in-ci
          AUTH_GITHUB_ID: ci-github-client-id
          AUTH_GITHUB_SECRET: ci-github-client-secret
          SERVICE_SECRET: ci-service-secret-change-only-in-ci

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high
