name: CI - Alcide

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
  NEXTAUTH_URL: http://localhost:3000
  AUTH_SECRET: ci-auth-secret-change-only-in-ci
  AUTH_GOOGLE_ID: ci-google-client-id
  AUTH_GOOGLE_SECRET: ci-google-client-secret
  SERVICE_SECRET: ${{ secrets.SERVICE_SECRET || 'ci-service-secret-change-only-in-ci' }}

jobs:
  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: TypeScript check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Test Vercel deployment policy
        run: pnpm test:vercel-ignore

  test-unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alcide
          POSTGRES_PASSWORD: alcide_dev
          POSTGRES_DB: alcide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alcide -d alcide"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Apply database migrations for integration tests
        run: pnpm --filter api db:migrate
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide

      - name: Run API and Web tests with coverage
        run: pnpm test:coverage
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide
          TEST_DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Run PostgreSQL repository tests with dedicated coverage
        run: pnpm --filter api test:integration:coverage
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide
          TEST_DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide

      - name: Upload API coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report-api
          path: apps/api/coverage/
          if-no-files-found: ignore

      - name: Upload Web coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report-web
          path: apps/web/coverage/
          if-no-files-found: error

      - name: Upload PostgreSQL integration coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report-api-integration
          path: apps/api/coverage/integration/
          if-no-files-found: error

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          DATABASE_URL: postgresql://alcide:alcide_dev@localhost:5432/alcide
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  test-e2e-smoke:
    name: E2E smoke and accessibility
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter shared build

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium firefox

      - name: Run public E2E smoke tests
        run: pnpm test:e2e:smoke
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag alcide-api:ci .

      - name: Build Web image
        run: >
          docker build
          --file apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001
          --tag alcide-web:ci .
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_URL: http://localhost:3000
          AUTH_SECRET: ci-auth-secret-change-only-in-ci
          AUTH_GOOGLE_ID: ci-google-client-id
          AUTH_GOOGLE_SECRET: ci-google-client-secret
          SERVICE_SECRET: ci-service-secret-change-only-in-ci

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=low
