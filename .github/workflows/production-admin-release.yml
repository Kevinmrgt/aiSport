name: Production - Closed admin release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-runtime-diagnostics:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_API_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
      DIAGNOSTIC_FILE: ${{ runner.temp }}/generation-runtime-diagnostics.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Read bounded runtime logs and export application diagnostics only
        run: node scripts/read-runtime-diagnostics.mjs
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generation-runtime-diagnostics
          path: ${{ runner.temp }}/generation-runtime-diagnostics.json
          if-no-files-found: error
          retention-days: 7
